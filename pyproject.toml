[project]
name = "wechat4-db-decryptor"
version = "0.1.0"
description = "CLI wrapper for decrypting WeChat 4.x encrypted databases to SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "wechat4-db-decryptor contributors" }
]
dependencies = []

[project.optional-dependencies]
backend = [
  "wechat-decrypt-tool @ git+https://github.com/LifeArchiveProject/WeChatDataAnalysis.git",
]

[project.scripts]
wechat4-decrypt = "wechat4_db_decryptor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat4_db_decryptor"]
